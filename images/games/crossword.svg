<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">Quick English Crossword game preview</title>
  <desc id="desc">A crossword board with highlighted letters beside across and down vocabulary clues.</desc>
