<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOEIC Practice Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #16233f;
        --ink-soft: #2c3b5e;
        --paper: #f1f3f6;
        --paper-card: #ffffff;
        --border: #d8dce3;
        --gold: #c9982e;
        --gold-soft: #f3e7cb;
        --teal: #2f7a78;
        --teal-soft: #e1f0ef;
        --coral: #c1443c;
        --coral-soft: #fbe7e5;
        --text: #1b2436;
        --text-mute: #5b6478;
        --serif: "Source Serif 4", Georgia, serif;
        --sans: "IBM Plex Sans", -apple-system, sans-serif;
        --mono: "IBM Plex Mono", "Courier New", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--paper);
        font-family: var(--sans);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
      }
      .app {
        max-width: 840px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* ===== Top bar ===== */
      .topbar {
        background: var(--ink);
        color: #fff;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .topbar .brand {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .topbar .brand small {
        font-family: var(--mono);
        font-size: 0.62rem;
        color: var(--gold);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .topbar .meta {
        font-family: var(--mono);
        font-size: 0.78rem;
        display: flex;
        align-items: center;
        gap: 16px;
        color: #c9d2e3;
      }
      .topbar .meta .timer {
        color: #fff;
      }
      .progress-track {
        height: 4px;
        background: #2a3a5c;
      }
      .progress-fill {
        height: 100%;
        background: var(--gold);
        transition: width 0.3s ease;
        width: 0%;
      }
      /* ===== Main content ===== */
      main {
        flex: 1;
        padding: 28px 20px 100px;
      }
      .card {
        background: var(--paper-card);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 28px;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--teal);
        margin-bottom: 10px;
        display: block;
      }
      h1 {
        font-family: var(--serif);
        font-size: 2.1rem;
        margin: 0 0 6px;
        color: var(--ink);
        font-weight: 700;
      }
      h2 {
        font-family: var(--serif);
        font-size: 1.5rem;
        margin: 0 0 12px;
        color: var(--ink);
        font-weight: 600;
      }
      h3 {
        font-family: var(--serif);
        font-size: 1.15rem;
        margin: 0 0 10px;
        color: var(--ink);
        font-weight: 600;
      }
      p {
        color: var(--text);
      }
      .sub {
        color: var(--text-mute);
        font-size: 0.98rem;
      }

      /* Intro screen */
      .intro-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin: 24px 0;
      }
      .intro-part {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 14px 16px;
        background: var(--paper);
      }
      .intro-part .num {
        font-family: var(--mono);
        color: var(--teal);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
      }
      .intro-part .name {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 1.02rem;
        margin: 2px 0 4px;
      }
      .intro-part .count {
        font-size: 0.85rem;
        color: var(--text-mute);
      }
      .section-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0 10px;
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .section-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .btn {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 0.95rem;
        border: none;
        border-radius: 3px;
        padding: 13px 26px;
        cursor: pointer;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .btn-primary {
        background: var(--ink);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--ink-soft);
      }
      .btn-primary:disabled {
        background: #aeb6c6;
        cursor: not-allowed;
      }
      .btn-ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        border-color: var(--ink);
      }
      .btn-gold {
        background: var(--gold);
        color: #fff;
      }
      .btn-row {
        display: flex;
        gap: 12px;
        margin-top: 22px;
        flex-wrap: wrap;
      }

      /* Part intro */
      .part-instructions {
        background: var(--teal-soft);
        border-left: 3px solid var(--teal);
        padding: 14px 16px;
        border-radius: 3px;
        font-size: 0.95rem;
        margin: 16px 0;
      }

      /* Question screen */
      .q-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .q-tag {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--teal);
        background: var(--teal-soft);
        padding: 4px 9px;
        border-radius: 3px;
      }
      .q-number {
        font-family: var(--mono);
        font-size: 0.85rem;
        color: var(--text-mute);
      }
      .context-box {
        border: 1px solid var(--border);
        background: var(--paper);
        border-radius: 4px;
        padding: 16px 18px;
        margin-bottom: 18px;
      }
      .context-box .who {
        font-weight: 600;
        color: var(--ink);
      }
      .context-box p {
        margin: 0 0 10px;
        font-size: 0.96rem;
      }
      .context-box p:last-child {
        margin-bottom: 0;
      }
      .svg-wrap {
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 16px;
        background: #edeff3;
      }
      .svg-wrap svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .audio-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .audio-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--ink);
        color: #fff;
        border: none;
        padding: 10px 18px;
        border-radius: 20px;
        font-family: var(--sans);
        font-weight: 600;
        font-size: 0.88rem;
        cursor: pointer;
      }
      .audio-btn:hover {
        background: var(--ink-soft);
      }
      .audio-btn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gold);
      }
      .link-btn {
        background: none;
        border: none;
        color: var(--teal);
        font-size: 0.85rem;
        cursor: pointer;
        text-decoration: underline;
        font-family: var(--sans);
      }
      .transcript {
        display: none;
        font-size: 0.9rem;
        color: var(--text-mute);
        border-top: 1px dashed var(--border);
        margin-top: 10px;
        padding-top: 10px;
        font-style: italic;
      }
      .transcript.show {
        display: block;
      }
      .prompt {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 16px;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 12px 14px;
        cursor: pointer;
        transition:
          border-color 0.12s ease,
          background 0.12s ease;
      }
      .option:hover {
        border-color: var(--ink-soft);
        background: var(--paper);
      }
      .option .letter {
        font-family: var(--mono);
        font-weight: 600;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.78rem;
        flex-shrink: 0;
        color: var(--ink);
      }
      .option.selected {
        border-color: var(--ink);
        background: var(--teal-soft);
      }
      .option.selected .letter {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .option-text {
        font-size: 0.96rem;
        padding-top: 2px;
      }

      /* review / result states */
      .option.correct-answer {
        border-color: var(--gold);
        background: var(--gold-soft);
      }
      .option.correct-answer .letter {
        background: var(--gold);
        color: #fff;
        border-color: var(--gold);
      }
      .option.wrong-answer {
        border-color: var(--coral);
        background: var(--coral-soft);
      }
      .option.wrong-answer .letter {
        background: var(--coral);
        color: #fff;
        border-color: var(--coral);
      }
      .explain-box {
        margin-top: 16px;
        border-left: 3px solid var(--gold);
        background: var(--gold-soft);
        padding: 12px 16px;
        border-radius: 3px;
        font-size: 0.92rem;
      }
      .explain-box b {
        color: var(--ink);
      }

      .nav-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 24px;
      }
      .flag-note {
        font-size: 0.8rem;
        color: var(--text-mute);
        font-family: var(--mono);
      }

      /* ===== Score report ===== */
      .report-hero {
        text-align: center;
        padding: 10px 0 24px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .report-hero .eyebrow {
        justify-content: center;
      }
      .total-score {
        font-family: var(--serif);
        font-weight: 700;
        font-size: 4.2rem;
        color: var(--ink);
        line-height: 1;
        margin: 6px 0;
      }
      .total-score span {
        font-size: 1.4rem;
        color: var(--text-mute);
        font-weight: 400;
      }
      .scale-bar-wrap {
        margin: 20px auto;
        max-width: 520px;
      }
      .scale-label-row {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--text-mute);
        margin-bottom: 4px;
      }
      .scale-bar {
        position: relative;
        height: 10px;
        background: linear-gradient(90deg, #dce4ee, #c9d6e8);
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .scale-marker {
        position: absolute;
        top: -6px;
        width: 2px;
        height: 22px;
        background: var(--gold);
      }
      .scale-marker::after {
        content: "";
        position: absolute;
        top: -5px;
        left: -4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--gold);
      }
      .section-scores {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 26px;
      }
      .section-score-card {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 16px;
        text-align: center;
      }
      .section-score-card .label {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--teal);
      }
      .section-score-card .num {
        font-family: var(--serif);
        font-size: 2.1rem;
        font-weight: 700;
        color: var(--ink);
        margin: 4px 0;
      }
      .section-score-card .frac {
        font-size: 0.82rem;
        color: var(--text-mute);
      }
      .part-breakdown {
        margin-top: 28px;
      }
      .part-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        font-size: 0.92rem;
      }
      .part-row:last-child {
        border-bottom: none;
      }
      .part-row .pname {
        font-weight: 600;
        color: var(--ink);
      }
      .bar-mini {
        flex: 1;
        margin: 0 14px;
        height: 6px;
        background: #e7e9ee;
        border-radius: 4px;
        overflow: hidden;
      }
      .bar-mini-fill {
        height: 100%;
        background: var(--teal);
      }
      .review-list {
        margin-top: 10px;
      }
      .review-item {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 16px 18px;
        margin-bottom: 12px;
      }
      .review-item .rtag {
        font-family: var(--mono);
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 10px;
        margin-right: 8px;
      }
      .rtag.correct {
        background: var(--gold-soft);
        color: #8a6a17;
      }
      .rtag.wrong {
        background: var(--coral-soft);
        color: var(--coral);
      }
      .rtag.skipped {
        background: #edeff3;
        color: var(--text-mute);
      }

      footer.help {
        text-align: center;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--text-mute);
        padding: 18px;
      }
      kbd {
        display: inline-block;
        font-family: var(--mono);
        font-size: 0.64rem;
        background: #e7eaf0;
        border: 1px solid #c8cdd8;
        border-bottom-width: 2px;
        border-radius: 2px;
        padding: 1px 5px;
        color: var(--ink-soft);
      }
      .keyboard-hint {
        font-family: var(--mono);
        font-size: 0.68rem;
        color: var(--text-mute);
        text-align: center;
        margin-top: 14px;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      .audio-btn.playing .dot {
        animation: pulse-dot 0.8s ease-in-out infinite;
      }
      .audio-btn.playing {
        background: var(--teal);
      }
      .flag-unanswered {
        color: #8a5500;
      }
      .cefr-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--teal-soft);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 5px 14px;
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--teal);
        margin-top: 10px;
      }
      .cefr-badge .lvl {
        font-weight: 700;
        font-size: 1rem;
      }

      @media (max-width: 600px) {
        .intro-grid {
          grid-template-columns: 1fr;
        }
        .section-scores {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 1.6rem;
        }
        .total-score {
          font-size: 3rem;
        }
        main {
          padding: 20px 14px 90px;
        }
        .card {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar" id="topbar" style="display: none">
        <div class="brand">
          TOEIC<sup style="font-size: 0.55rem">&reg;</sup>
          <small>Practice Test</small>
        </div>
        <div class="meta">
          <span id="partLabel">Part 1</span>
          <span class="timer" id="timerDisplay">00:00</span>
        </div>
      </div>
      <div class="progress-track" id="progressTrack" style="display: none">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <main id="main"></main>
      <footer class="help">
        Unofficial practice material &middot; not affiliated with ETS or the
        TOEIC&reg; program
      </footer>
    </div>

    <script>
      /* =========================================================
   TOEIC PRACTICE TEST — DATA
   ========================================================= */

      const SVGS = {

    <rect x="60" y="150" width="55" height="20" fill="#8C6A3C"/>
  </svg>`,
        waiting: `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
    <rect width="400" height="260" fill="#EFF1F5"/>

    <rect x="260" y="160" width="60" height="50" fill="#4A5674"/>
    <circle cx="70" cy="140" r="20" fill="#E7C79B"/>

    <circle cx="180" cy="140" r="20" fill="#D9AE7C"/>
    <rect x="162" y="158" width="36" height="35" fill="#C1443C"/>

      };

      // Each "block" carries shared context (audio/svg/passage) and one or more questions.
      const testParts = [
        {
          id: "p1",
          section: "listening",
          key: "Part 1",
          title: "Part 1: Photographs",
          directions:
            "For each question, a picture is shown. Four statements about the picture will be read aloud (or read via transcript). Select the statement that best describes the picture.",
          blocks: [
            {
              type: "photo",
              svg: "desk",
              questions: [
                {
                  audio:
                    "Look at the picture. (A) The man is talking on the phone. (B) The man is typing on his laptop. (C) The man is reading a newspaper. (D) The man is standing near the window.",
                  options: [
                    "The man is talking on the phone.",
                    "The man is typing on his laptop.",
                    "The man is reading a newspaper.",
                    "The man is standing near the window.",
                  ],
                  correct: 1,

            },
          ],
        },
      ];

      /* =========================================================
   FLATTEN INTO A LINEAR QUESTION SEQUENCE
   ========================================================= */
      const sequence = []; // {partIdx, blockIdx, qIdx, isFirstOfPart, isFirstOfBlock}
      testParts.forEach((part, pi) => {
        part.blocks.forEach((block, bi) => {
          block.questions.forEach((q, qi) => {
            sequence.push({
              pi,
              bi,
              qi,
              isFirstOfPart: bi === 0 && qi === 0,
              isFirstOfBlock: qi === 0,
            });
          });
        });
      });
      const TOTAL_Q = sequence.length;

      /* =========================================================
   STATE
   ========================================================= */
      let state = {
        screen: "intro", // intro | partintro | question | report
        seqIndex: 0,
        answers: {}, // key "pi-bi-qi" -> selected option index
        startTime: null,
        elapsed: 0,
        timerHandle: null,
        pendingPartIntroFor: 0,
      };

      function qKey(pi, bi, qi) {
        return pi + "-" + bi + "-" + qi;
      }

      /* =========================================================
   RENDER HELPERS
   ========================================================= */
      const mainEl = document.getElementById("main");
      const topbar = document.getElementById("topbar");
      const progressTrack = document.getElementById("progressTrack");
      const progressFill = document.getElementById("progressFill");
      const partLabelEl = document.getElementById("partLabel");
      const timerDisplay = document.getElementById("timerDisplay");

      function fmtTime(s) {
        const m = Math.floor(s / 60)
          .toString()
          .padStart(2, "0");
        const sec = (s % 60).toString().padStart(2, "0");
        return m + ":" + sec;
      }
      function startTimer() {
        if (state.timerHandle) return;
        state.startTime = Date.now() - state.elapsed * 1000;
        state.timerHandle = setInterval(() => {
          state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
          timerDisplay.textContent = fmtTime(state.elapsed);
        }, 1000);
      }
      function stopTimer() {
        clearInterval(state.timerHandle);
        state.timerHandle = null;
      }

      function speak(text, btn) {
        if (!("speechSynthesis" in window)) {
          alert(
            'Speech playback is not supported in this browser. Use "Show transcript" instead.',
          );
          return;
        }
        if (btn && btn.classList.contains("playing")) {
          window.speechSynthesis.cancel();
          btn.classList.remove("playing");
          return;
        }
        window.speechSynthesis.cancel();
        document
          .querySelectorAll(".audio-btn.playing")
          .forEach((b) => b.classList.remove("playing"));
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.95;
        if (btn) {
          btn.classList.add("playing");
          utter.onend = () => btn.classList.remove("playing");
          utter.onerror = () => btn.classList.remove("playing");
        }
        window.speechSynthesis.speak(utter);
      }

      function letterFor(i) {
        return String.fromCharCode(65 + i);
      }

      /* =========================================================
   SCREENS
   ========================================================= */
      function renderIntro() {
        topbar.style.display = "none";
        progressTrack.style.display = "none";
        const listeningQ = testParts
          .filter((p) => p.section === "listening")
          .reduce(
            (a, p) =>
              a + p.blocks.reduce((b, bl) => b + bl.questions.length, 0),
            0,
          );
        const readingQ = testParts
          .filter((p) => p.section === "reading")
          .reduce(
            (a, p) =>
              a + p.blocks.reduce((b, bl) => b + bl.questions.length, 0),
            0,
          );
        mainEl.innerHTML = `
    <div class="card">
      <span class="eyebrow">Unofficial Practice Material</span>
      <h1>TOEIC&reg; Listening &amp; Reading<br>Practice Test</h1>
      <p class="sub">A condensed, self-contained practice test covering all seven official question types &mdash; four Listening parts and three Reading parts &mdash; with a full answer key and explanations at the end.</p>

      <div class="section-divider">Listening Section &middot; ${listeningQ} questions</div>
      <div class="intro-grid">
        <div class="intro-part"><span class="num">PART 1</span><div class="name">Photographs</div><div class="count">4 questions</div></div>
        <div class="intro-part"><span class="num">PART 2</span><div class="name">Question-Response</div><div class="count">5 questions</div></div>
        <div class="intro-part"><span class="num">PART 3</span><div class="name">Conversations</div><div class="count">6 questions</div></div>
        <div class="intro-part"><span class="num">PART 4</span><div class="name">Talks</div><div class="count">6 questions</div></div>
      </div>

      <div class="section-divider">Reading Section &middot; ${readingQ} questions</div>
      <div class="intro-grid">
        <div class="intro-part"><span class="num">PART 5</span><div class="name">Incomplete Sentences</div><div class="count">10 questions</div></div>
        <div class="intro-part"><span class="num">PART 6</span><div class="name">Text Completion</div><div class="count">8 questions</div></div>
        <div class="intro-part"><span class="num">PART 7</span><div class="name">Reading Comprehension</div><div class="count">7 questions</div></div>
      </div>

      <p class="sub" style="margin-top:20px;">Listening items include a <b>Play Audio</b> button (text-to-speech) as well as an optional transcript toggle, so this test works with or without sound.</p>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="beginTest()">Begin Test</button>
      </div>
    </div>
  `;
      }

      function beginTest() {
        state.screen = "partintro";
        state.pendingPartIntroFor = 0;
        state.seqIndex = 0;
        render();
      }

      function renderPartIntro(partIdx) {
        topbar.style.display = "flex";
        progressTrack.style.display = "block";
        const part = testParts[partIdx];
        partLabelEl.textContent = part.key;
        updateProgressBar();
        startTimer();
        mainEl.innerHTML = `
    <div class="card">
      <span class="eyebrow">${part.section === "listening" ? "Listening Section" : "Reading Section"}</span>
      <h2>${part.title}</h2>
      <div class="part-instructions">${part.directions}</div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="startPartQuestions(${partIdx})">Start ${part.key}</button>
      </div>
    </div>
  `;
      }

      function startPartQuestions(partIdx) {
        // find first seqIndex belonging to this part
        const idx = sequence.findIndex((s) => s.pi === partIdx);
        state.seqIndex = idx;
        state.screen = "question";
        render();
      }

      function updateProgressBar() {
        const answeredCount = Object.keys(state.answers).length;
        const pct = Math.round((state.seqIndex / TOTAL_Q) * 100);
        progressFill.style.width = pct + "%";
      }

      function renderQuestion() {
        topbar.style.display = "flex";
        progressTrack.style.display = "block";
        const item = sequence[state.seqIndex];
        const part = testParts[item.pi];
        const block = part.blocks[item.bi];
        const q = block.questions[item.qi];
        partLabelEl.textContent = part.key;
        updateProgressBar();

        const key = qKey(item.pi, item.bi, item.qi);
        const selected = state.answers[key];

        // context html
        let contextHtml = "";
        if (block.type === "photo") {
          contextHtml += `<div class="svg-wrap">${SVGS[block.svg]}</div>`;
          contextHtml += `<div class="audio-controls">
        <button class="audio-btn" onclick="speak(${JSON.stringify(q.audio)}, this)"><span class="dot"></span>Play Audio (A–D)</button>
        <button class="link-btn" onclick="toggleTranscript(this)">Show transcript</button>
      </div>
      <div class="transcript">${q.audio}</div>`;
        } else if (block.type === "audio-only") {
          contextHtml += `<div class="audio-controls">
        <button class="audio-btn" onclick="speak(${JSON.stringify(q.audio)}, this)"><span class="dot"></span>Play Audio</button>
        <button class="link-btn" onclick="toggleTranscript(this)">Show transcript</button>
      </div>
      <div class="transcript">${q.audio}</div>`;
        } else if (block.type === "conversation") {
          const fullText = block.lines
            .map((l) => l.who + ": " + l.text)
            .join(" ");
          contextHtml += `<div class="audio-controls">
        <button class="audio-btn" onclick="speak(${JSON.stringify(fullText)}, this)"><span class="dot"></span>Play Conversation</button>
        <button class="link-btn" onclick="toggleTranscript(this)">Show transcript</button>
      </div>
      <div class="context-box transcript">
        ${block.lines.map((l) => `<p><span class="who">${l.who}:</span> ${l.text}</p>`).join("")}
      </div>`;
        } else if (block.type === "talk") {
          contextHtml += `<div class="audio-controls">
        <button class="audio-btn" onclick="speak(${JSON.stringify(block.text)}, this)"><span class="dot"></span>Play Talk</button>
        <button class="link-btn" onclick="toggleTranscript(this)">Show transcript</button>
      </div>
      <div class="context-box transcript">
        <p><span class="who">${block.speakerLabel}:</span> ${block.text}</p>
      </div>`;
        } else if (block.type === "passage") {
          contextHtml += `<div class="context-box">
        <h3>${block.passageTitle}</h3>
        ${block.passageParts.map((p) => (p === "" ? "" : `<p>${p}</p>`)).join("")}
      </div>`;
        } else if (block.type === "double-passage") {
          contextHtml += `<div class="context-box">
        <h3>${block.passageTitle}</h3>
        ${block.docs.map((d) => `<p style="font-family:var(--mono); font-size:0.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--teal); margin-top:14px;">${d.label}</p>` + d.parts.map((p) => (p === "" ? "" : `<p>${p}</p>`)).join("")).join("")}
      </div>`;
        }

        const promptText = q.prompt || "";
        const blankNote = q.blankLabel
          ? `<span class="q-tag">Blank ${q.blankLabel}</span> `
          : "";

        const optionsHtml = q.options
          .map((opt, i) => {
            const isSelected = selected === i;
            return `<div class="option ${isSelected ? "selected" : ""}" onclick="selectOption(${i})">
      <div class="letter">${letterFor(i)}</div>
      <div class="option-text">${opt}</div>
    </div>`;
          })
          .join("");

        const isLast = state.seqIndex === TOTAL_Q - 1;
        const globalQNum = state.seqIndex + 1;

        mainEl.innerHTML = `
    <div class="card">
      <div class="q-header">
        <span class="q-tag">${part.title}</span>
        <span class="q-number">Question ${globalQNum} of ${TOTAL_Q}</span>
      </div>
      ${contextHtml}
      ${promptText ? `<div class="prompt">${blankNote}${promptText}</div>` : blankNote ? `<div class="prompt">${blankNote}Select the best option to complete the sentence.</div>` : ""}
      <div class="options">${optionsHtml}</div>
      <p class="keyboard-hint">Press <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> to select &nbsp;&middot;&nbsp; <kbd>Enter</kbd> or <kbd>&rarr;</kbd> to advance &nbsp;&middot;&nbsp; <kbd>&larr;</kbd> to go back</p>
      <div class="nav-row">
        <button class="btn btn-ghost" onclick="prevQuestion()" ${state.seqIndex === 0 ? "disabled" : ""}>Back</button>
        <span class="flag-note${selected === undefined ? " flag-unanswered" : ""}">&#9679; ${selected !== undefined ? "Answered" : "Not answered yet"}</span>
        <button class="btn btn-primary" onclick="nextQuestion()" ${selected === undefined ? "disabled" : ""}>${isLast ? "Finish Test" : "Next"}</button>
      </div>
    </div>
  `;
      }

      function toggleTranscript(btn) {
        const t = btn.parentElement.nextElementSibling.classList.contains(
          "transcript",
        )
          ? btn.parentElement.nextElementSibling
          : btn.closest(".card").querySelector(".transcript");
        t.classList.toggle("show");
        btn.textContent = t.classList.contains("show")
          ? "Hide transcript"
          : "Show transcript";
      }

      function selectOption(i) {
        const item = sequence[state.seqIndex];
        const key = qKey(item.pi, item.bi, item.qi);
        state.answers[key] = i;
        render();
      }

      function nextQuestion() {
        if (state.seqIndex === TOTAL_Q - 1) {
          finishTest();
          return;
        }
        const nextItem = sequence[state.seqIndex + 1];
        const currentItem = sequence[state.seqIndex];
        state.seqIndex++;
        if (nextItem.pi !== currentItem.pi) {
          state.screen = "partintro";
        } else {
          state.screen = "question";
        }
        render();
      }

      function prevQuestion() {
        if (state.seqIndex === 0) return;
        state.seqIndex--;
        state.screen = "question";
        render();
      }

      /* =========================================================
   SCORING + REPORT
   ========================================================= */
      function getCEFR(score) {
        if (score >= 945) return { level: "C2", desc: "Mastery / Proficiency" };
        if (score >= 785) return { level: "C1", desc: "Advanced Professional" };
        if (score >= 550) return { level: "B2", desc: "Upper Intermediate" };
        if (score >= 405) return { level: "B1", desc: "Intermediate" };
        if (score >= 255) return { level: "A2", desc: "Elementary" };
        return { level: "A1", desc: "Beginner" };
      }

      function finishTest() {
        stopTimer();
        state.screen = "report";
        render();
      }

      function computeResults() {
        let listeningCorrect = 0,
          listeningTotal = 0,
          readingCorrect = 0,
          readingTotal = 0;
        const perPart = {};
        sequence.forEach((item) => {
          const part = testParts[item.pi];
          const block = part.blocks[item.bi];
          const q = block.questions[item.qi];
          const key = qKey(item.pi, item.bi, item.qi);
          const chosen = state.answers[key];
          const correct = chosen === q.correct;
          if (!perPart[part.key])
            perPart[part.key] = { correct: 0, total: 0, section: part.section };
          perPart[part.key].total++;
          if (correct) perPart[part.key].correct++;
          if (part.section === "listening") {
            listeningTotal++;
            if (correct) listeningCorrect++;
          } else {
            readingTotal++;
            if (correct) readingCorrect++;
          }
        });
        return {
          listeningCorrect,
          listeningTotal,
          readingCorrect,
          readingTotal,
          perPart,
        };
      }

      function scaleScore(correct, total) {
        // simplified proportional mapping to the official 5-495 scale, rounded to nearest 5
        if (total === 0) return 5;
        const raw = (correct / total) * 495;
        let scaled = Math.round(raw / 5) * 5;
        scaled = Math.max(5, Math.min(495, scaled));
        return scaled;
      }

      function renderReport() {
        topbar.style.display = "flex";
        progressTrack.style.display = "block";
        progressFill.style.width = "100%";
        partLabelEl.textContent = "Score Report";
        stopTimer();

        const r = computeResults();
        const lScaled = scaleScore(r.listeningCorrect, r.listeningTotal);
        const rScaled = scaleScore(r.readingCorrect, r.readingTotal);
        const total = lScaled + rScaled;
        const pct = Math.round((total / 990) * 100);
        const cefr = getCEFR(total);

        const partRowsHtml = Object.keys(perPartOrdered(r.perPart))
          .map((k) => {
            const d = r.perPart[k];
            const pctBar = Math.round((d.correct / d.total) * 100);
            return `<div class="part-row">
      <span class="pname">${k}</span>
      <div class="bar-mini"><div class="bar-mini-fill" style="width:${pctBar}%"></div></div>
      <span>${d.correct}/${d.total}</span>
    </div>`;
          })
          .join("");

        const reviewHtml = sequence
          .map((item, idx) => {
            const part = testParts[item.pi];
            const block = part.blocks[item.bi];
            const q = block.questions[item.qi];
            const key = qKey(item.pi, item.bi, item.qi);
            const chosen = state.answers[key];
            const isCorrect = chosen === q.correct;
            const tag =
              chosen === undefined
                ? `<span class="rtag skipped">SKIPPED</span>`
                : isCorrect
                  ? `<span class="rtag correct">CORRECT</span>`
                  : `<span class="rtag wrong">INCORRECT</span>`;
            const optsHtml = q.options
              .map((opt, i) => {
                let cls = "";
                if (i === q.correct) cls = "correct-answer";
                else if (i === chosen) cls = "wrong-answer";
                return `<div class="option ${cls}" style="cursor:default;">
        <div class="letter">${letterFor(i)}</div>
        <div class="option-text">${opt}</div>
      </div>`;
              })
              .join("");
            return `<div class="review-item">
      <div style="margin-bottom:8px;">${tag}<span class="q-number">${part.title} &middot; Question ${idx + 1}</span></div>
      <div class="prompt" style="font-size:0.98rem;">${q.prompt || (q.blankLabel ? "Blank " + q.blankLabel : "Select the correct statement.")}</div>
      <div class="options">${optsHtml}</div>
      <div class="explain-box"><b>Explanation:</b> ${q.explanation}</div>
    </div>`;
          })
          .join("");

        mainEl.innerHTML = `
    <div class="card">
      <div class="report-hero">
        <span class="eyebrow">Score Report</span>
        <div class="total-score">${total}<span> / 990</span></div>
        <p class="sub">Estimated scaled score &middot; time: ${fmtTime(state.elapsed)}</p>
        <div><span class="cefr-badge"><span class="lvl">${cefr.level}</span>${cefr.desc}</span></div>
        <div class="scale-bar-wrap">
          <div class="scale-label-row"><span>10</span><span>990</span></div>
          <div class="scale-bar"><div class="scale-marker" style="left:calc(${pct}% - 1px)"></div></div>
        </div>
      </div>

      <div class="section-scores">
        <div class="section-score-card">
          <div class="label">Listening</div>
          <div class="num">${lScaled}</div>
          <div class="frac">${r.listeningCorrect} / ${r.listeningTotal} correct</div>
        </div>
        <div class="section-score-card">
          <div class="label">Reading</div>
          <div class="num">${rScaled}</div>
          <div class="frac">${r.readingCorrect} / ${r.readingTotal} correct</div>
        </div>
      </div>

      <div class="part-breakdown">
        <h3>Score by Part</h3>
        ${partRowsHtml}
      </div>

      <p class="sub" style="margin-top:14px; font-size:0.82rem;">Note: this scaled score uses a simplified proportional formula for practice purposes only. It is not the official ETS scoring algorithm and should be treated as a rough estimate.</p>

      <div class="btn-row">
        <button class="btn btn-gold" onclick="scrollToReview()">Review Answers &amp; Explanations</button>
        <button class="btn btn-ghost" onclick="restartTest()">Retake Test</button>
      </div>
    </div>

    <div class="card" style="margin-top:20px;" id="reviewSection">
      <h2>Answer Review</h2>
      <p class="sub">Every question, your answer, the correct answer, and why.</p>
      <div class="review-list">${reviewHtml}</div>
    </div>
  `;
      }

      function perPartOrdered(perPart) {
        // ensure order follows testParts order
        const ordered = {};
        testParts.forEach((p) => {
          if (perPart[p.key]) ordered[p.key] = perPart[p.key];
        });
        return ordered;
      }

      function scrollToReview() {
        document
          .getElementById("reviewSection")
          .scrollIntoView({ behavior: "smooth" });
      }

      function restartTest() {
        state = {
          screen: "intro",
          seqIndex: 0,
          answers: {},
          startTime: null,
          elapsed: 0,
          timerHandle: null,
          pendingPartIntroFor: 0,
        };
        timerDisplay.textContent = "00:00";
        render();
      }

      /* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */
      document.addEventListener("keydown", function (e) {
        if (state.screen !== "question") return;
        if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
        const key = e.key.toUpperCase();
        if (
          ["A", "B", "C", "D"].includes(key) &&
          !e.ctrlKey &&
          !e.metaKey &&
          !e.altKey
        ) {
          const item = sequence[state.seqIndex];
          const q = testParts[item.pi].blocks[item.bi].questions[item.qi];
          const idx = key.charCodeAt(0) - 65;
          if (idx < q.options.length) {
            e.preventDefault();
            selectOption(idx);
          }
        } else if (
          (e.key === "Enter" || e.key === "ArrowRight") &&
          !e.target.closest("button")
        ) {
          const item = sequence[state.seqIndex];
          const k = qKey(item.pi, item.bi, item.qi);
          if (state.answers[k] !== undefined) {
            e.preventDefault();
            nextQuestion();
          }
        } else if (e.key === "ArrowLeft" && !e.target.closest("button")) {
          if (state.seqIndex > 0) {
            e.preventDefault();
            prevQuestion();
          }
        }
      });

      /* =========================================================
   ROUTER
   ========================================================= */
      function render() {
        window.scrollTo(0, 0);
        if (state.screen === "intro") renderIntro();
        else if (state.screen === "partintro")
          renderPartIntro(sequence[state.seqIndex].pi);
        else if (state.screen === "question") renderQuestion();
        else if (state.screen === "report") renderReport();
      }

      render();
    </script>
  </body>
</html>
