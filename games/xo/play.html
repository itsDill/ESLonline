  <body>
    <div class="game-container">
      <div class="header">
        <h1>❌⭕ XO</h1>
        <p>Answer English questions to mark your spots and win!</p>
      </div>

      <div class="game-area">
        <!-- Setup Screen -->
        <div class="setup-screen" id="setupScreen">
          <h2>🎮 Prepare for Battle</h2>

          <!-- Difficulty Selection -->
          <div class="setup-section">
            <h3>Select Difficulty</h3>
            <div class="setup-buttons" id="difficultyButtons">
              <button class="setup-btn" onclick="selectDifficulty('easy')">
                ⭐ Easy<br /><span class="difficulty-label"
                  >Computer plays slower</span
                >
              </button>
              <button
                class="setup-btn selected"
                onclick="selectDifficulty('medium')"
              >
                ⭐⭐ Medium<br /><span class="difficulty-label"
                  >Balanced play</span
                >
              </button>
              <button class="setup-btn" onclick="selectDifficulty('hard')">
                ⭐⭐⭐ Hard<br /><span class="difficulty-label"
                  >Computer plays smart</span
                >
              </button>
            </div>
          </div>

          <!-- Player Mark Selection -->
          <div class="setup-section">
            <h3>Choose Your Mark</h3>
            <div class="setup-buttons" id="markButtons">
              <button class="setup-btn selected" onclick="selectMark('x')">
                ✅ X<br /><span class="difficulty-label"
                  >Play as X (first)</span
                >
              </button>
              <button class="setup-btn" onclick="selectMark('o')">
                ⭕ O<br /><span class="difficulty-label"
                  >Play as O (second)</span
                >
              </button>
            </div>
          </div>

          <!-- Start Button -->
          <button class="start-btn" onclick="startGame()" id="startBtn">
            <i class="fas fa-play"></i> Start Game
          </button>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
          <!-- Game Stats -->
          <div class="game-info">
            <div class="info-box">
              <div class="label">Your Mark</div>
              <div class="value" id="playerMarkDisplay">X</div>
            </div>
            <div class="info-box">
              <div class="label">Difficulty</div>
              <span class="difficulty-badge" id="difficultyDisplay"
                >Medium</span
              >
            </div>
            <div class="info-box">
              <div class="label">Score</div>
              <div class="value" id="scoreDisplay">0-0-0</div>
            </div>
          </div>

          <!-- Game Status -->
          <div class="game-status" id="gameStatus">Loading...</div>

          <!-- Question Section -->
          <div
            id="questionSection"
            class="question-section"
            style="display: none"
          >
            <div class="question-header">
              <span class="question-icon"
                ><i class="fas fa-lightbulb"></i
              ></span>
              <div class="question" id="questionText"></div>
            </div>
            <div class="options" id="optionsContainer"></div>
          </div>

          <!-- Game Board -->
          <div class="board" id="gameBoard"></div>

          <!-- Controls -->
          <div class="controls">
            <button class="btn btn-primary" onclick="resetGame()">
              <i class="fas fa-redo"></i> New Game
            </button>
            <button class="btn btn-setup" onclick="backToSetup()">
              <i class="fas fa-cog"></i> Change Settings
            </button>
            <button
              class="btn btn-secondary"
              onclick="window.location.href = 'games.html'"
            >
              <i class="fas fa-arrow-left"></i> Exit
            </button>
          </div>

          <!-- Statistics -->
          <div class="stats">
            <div class="stat-item">
              <div class="stat-label">Wins</div>
              <div class="stat-value" id="winCount">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Losses</div>
              <div class="stat-value" id="lossCount">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Draws</div>
              <div class="stat-value" id="drawCount">0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="back-link">
        <a href="games.html"
          ><i class="fas fa-arrow-left"></i> Back to All Games</a
        >
      </div>
    </div>

      // Game state
      let gameState = ["", "", "", "", "", "", "", "", ""];

          {

      // Winning combinations
      const winningCombos = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      // Setup functions
      function selectDifficulty(level) {
        gameConfig.difficulty = level;
        document
          .querySelectorAll("#difficultyButtons .setup-btn")
          .forEach((btn) => btn.classList.remove("selected"));
        event.target.closest(".setup-btn").classList.add("selected");
      }

      function selectMark(mark) {
        gameConfig.playerMark = mark.toUpperCase();
        gameConfig.computerMark = mark.toUpperCase() === "X" ? "O" : "X";
        document
          .querySelectorAll("#markButtons .setup-btn")
          .forEach((btn) => btn.classList.remove("selected"));
        event.target.closest(".setup-btn").classList.add("selected");
      }

      function startGame() {
        document.getElementById("setupScreen").style.display = "none";
        document.getElementById("gameScreen").style.display = "block";
        currentGameStarted = true;

        document.getElementById("playerMarkDisplay").textContent =
          gameConfig.playerMark;
        document.getElementById("difficultyDisplay").textContent =
          difficultyLevels[gameConfig.difficulty].label;

        resetGame();
      }

      function backToSetup() {
        document.getElementById("setupScreen").style.display = "block";
        document.getElementById("gameScreen").style.display = "none";
        currentGameStarted = false;
      }

      // Get questions based on difficulty
      function getQuestion() {
        const questions = questionsByDifficulty[gameConfig.difficulty];
        return questions[Math.floor(Math.random() * questions.length)];
      }

      // Initialize game
      function initGame() {
        loadStats();
        renderBoard();
        updateStatus();
        updateScoreDisplay();
      }

      // Render game board
      function renderBoard() {
        const board = document.getElementById("gameBoard");
        board.innerHTML = "";

        gameState.forEach((cell, index) => {
          const cellEl = document.createElement("div");
          cellEl.className = "cell";
          if (cell) {
            cellEl.classList.add(cell.toLowerCase());
            cellEl.classList.add("placed");
          }
          cellEl.textContent = cell;
          cellEl.onclick = () => handleCellClick(index);
          board.appendChild(cellEl);
        });
      }

      // Handle cell click
      function handleCellClick(index) {
        if (!gameActive || gameState[index] || !questionAnswered) {
          return;
        }

        // Player makes move
        gameState[index] = gameConfig.playerMark;
        questionAnswered = false;
        renderBoard();

        // Check game state
        if (checkWin(gameConfig.playerMark)) {
          gameActive = false;
          document.getElementById("gameStatus").textContent =
            "🎉 You Win! Excellent!";
          document.getElementById("gameStatus").className =
            "game-status winner";
          stats.wins++;
          trackGameCompletion("win");
          saveStats();
          updateScoreDisplay();
          return;
        }

        if (isBoardFull()) {
          gameActive = false;
          document.getElementById("gameStatus").textContent = "🤝 It's a Draw!";
          document.getElementById("gameStatus").className = "game-status draw";
          stats.draws++;
          trackGameCompletion("draw");
          saveStats();
          updateScoreDisplay();
          return;
        }

        // Computer makes move
        const delay = difficultyLevels[gameConfig.difficulty].delay;
        setTimeout(() => {
          computerMove();
        }, delay);
      }

      // Computer AI with difficulty-based behavior
      function computerMove() {
        const accuracy = difficultyLevels[gameConfig.difficulty].accuracy;

        // Hard difficulty: play perfectly
        if (gameConfig.difficulty === "hard") {
          const move = findBestMove();
          if (move !== -1) {
            gameState[move] = gameConfig.computerMark;
            renderBoard();
            finishComputerMove();
            return;
          }
        }

        // Medium difficulty: sometimes play perfectly, sometimes random
        if (gameConfig.difficulty === "medium" && Math.random() < accuracy) {
          const move = findBestMove();
          if (move !== -1) {
            gameState[move] = gameConfig.computerMark;
            renderBoard();
            finishComputerMove();
            return;
          }
        }

        // Easy difficulty: mostly random moves
        for (let i = 0; i < gameState.length; i++) {
          if (gameState[i] === "") {
            gameState[i] = gameConfig.computerMark;
            renderBoard();
            finishComputerMove();
            return;
          }
        }
      }

      // Find best move (minimax-inspired)
      function findBestMove() {
        // Try to win
        for (let combo of winningCombos) {
          const [a, b, c] = combo;
          if (
            gameState[a] === gameConfig.computerMark &&
            gameState[b] === gameConfig.computerMark &&
            gameState[c] === ""
          ) {
            return c;
          }
        }

        // Block player's win
        for (let combo of winningCombos) {
          const [a, b, c] = combo;
          if (
            gameState[a] === gameConfig.playerMark &&
            gameState[b] === gameConfig.playerMark &&
            gameState[c] === ""
          ) {
            return c;
          }
        }

        // Take center
        if (gameState[4] === "") return 4;

        // Take corners
        const corners = [0, 2, 6, 8].filter((i) => gameState[i] === "");
        if (corners.length > 0)
          return corners[Math.floor(Math.random() * corners.length)];

        // Take any available
        const available = gameState
          .map((cell, i) => (cell === "" ? i : -1))
          .filter((i) => i !== -1);
        return available.length > 0 ? available[0] : -1;
      }

      // Finish computer move
      function finishComputerMove() {
        if (checkWin(gameConfig.computerMark)) {
          gameActive = false;
          document.getElementById("gameStatus").textContent =
            "🤖 Computer Wins!";
          document.getElementById("gameStatus").className = "game-status loser";
          stats.losses++;
          trackGameCompletion("loss");
          saveStats();
          updateScoreDisplay();
          return;
        }

        if (isBoardFull()) {
          gameActive = false;
          document.getElementById("gameStatus").textContent = "🤝 It's a Draw!";
          document.getElementById("gameStatus").className = "game-status draw";
          stats.draws++;
          trackGameCompletion("draw");
          saveStats();
          updateScoreDisplay();
          return;
        }

        showQuestion();
      }

      // Show question
      function showQuestion() {
        const question = getQuestion();
        document.getElementById("questionText").textContent = question.question;

        const optionsContainer = document.getElementById("optionsContainer");
        optionsContainer.innerHTML = "";

        question.options.forEach((option, index) => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.textContent = option;
          btn.onclick = () => handleAnswer(index, question.correct);
          optionsContainer.appendChild(btn);
        });

        document.getElementById("questionSection").style.display = "block";
        updateStatus();
      }

      // Handle answer
      function handleAnswer(selected, correct) {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach((btn) => (btn.disabled = true));

        if (selected === correct) {
          buttons[selected].classList.add("correct");
          questionAnswered = true;
          setTimeout(() => {
            document.getElementById("questionSection").style.display = "none";
            updateStatus();
          }, 1500);
        } else {
          buttons[selected].classList.add("incorrect");
          buttons[correct].classList.add("correct");
          setTimeout(() => {
            computerMove();
            document.getElementById("questionSection").style.display = "none";
          }, 1500);
        }
      }

      // Check win condition
      function checkWin(mark) {
        return winningCombos.some((combo) => {
          const [a, b, c] = combo;
          return (
            gameState[a] === mark &&
            gameState[b] === mark &&
            gameState[c] === mark
          );
        });
      }

      // Check if board is full
      function isBoardFull() {
        return gameState.every((cell) => cell !== "");
      }

      // Update status
      function updateStatus() {
        if (!gameActive) return;

        if (questionAnswered) {
          document.getElementById("gameStatus").textContent =
            "👉 Your turn! Click a cell.";
          document.getElementById("gameStatus").className =
            "game-status active";
        } else {
          document.getElementById("gameStatus").textContent =
            "🧠 Answer the question to play!";
          document.getElementById("gameStatus").className = "game-status";
        }
      }

      // Update score display
      function updateScoreDisplay() {
        document.getElementById("scoreDisplay").textContent =
          `${stats.wins}-${stats.draws}-${stats.losses}`;
        document.getElementById("winCount").textContent = stats.wins;
        document.getElementById("lossCount").textContent = stats.losses;
        document.getElementById("drawCount").textContent = stats.draws;
      }

      // Reset game
      function resetGame() {
        gameState = ["", "", "", "", "", "", "", "", ""];
        gameActive = true;
        questionAnswered = false;
        renderBoard();
        document.getElementById("questionSection").style.display = "none";
        document.getElementById("gameStatus").textContent =
          "🧠 Answer a question to start!";
        document.getElementById("gameStatus").className = "game-status";
        updateScoreDisplay();
        showQuestion();
      }

      // Save stats
      function saveStats() {
        localStorage.setItem("xoStats", JSON.stringify(stats));
      }

      // Load stats
      function loadStats() {
        const saved = localStorage.getItem("xoStats");
        if (saved) {
          stats = JSON.parse(saved);
        }
        updateScoreDisplay();
      }

      // Track game completion
      function trackGameCompletion(result) {
        if (window.gtag) {
          gtag("event", "game_completion", {
            game_title: "XO",
            game_id: "xo",
            result: result,
            difficulty: gameConfig.difficulty,
            player_wins: stats.wins,
            player_losses: stats.losses,
          });
        }
      }

      // Initialize on load
      document.addEventListener("DOMContentLoaded", () => {
        loadStats();
        // Setup screen is already visible by default
      });
    </script>
  </body>
</html>
