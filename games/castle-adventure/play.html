<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2456627863532019"
      crossorigin="anonymous"
    ></script>

    <title>Grammar Castle</title>
    <style>
      :root {
        --night: #1b1830;
        --stone: #4a4660;
        --stone-dark: #33304a;
        --floor: #d9c9a3;
        --floor-alt: #cdbb92;
        --gold: #f2b632;
        --ruby: #c8374a;
        --moss: #3f8f5a;
        --ink: #f5eedc;
        --t: min(4vw, 36px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0, #2e2a52, var(--night) 70%);
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        padding: 16px;
        touch-action: manipulation;
      }
      .game-layout {
        display: grid;
        grid-template-columns: minmax(0, 800px) 320px;
        align-items: start;
        justify-content: center;
        gap: 24px;
        max-width: 1144px;
        margin: 0 auto;
      }
      .game-area {
        position: relative;
        min-width: 0;
      }
      .game {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Palatino Linotype", serif;
        font-size: clamp(1.5rem, 5vw, 2.3rem);
        color: var(--gold);
      }
      .hud {
        font-size: 1.3rem;
        display: flex;
        gap: 14px;
      }
      .fullscreen-btn {
        min-height: 40px;
        min-width: 42px;
        border: 1px solid #ffffff40;
        border-radius: 9px;
        background: var(--stone);
        color: var(--ink);
        font-size: 1.2rem;
        cursor: pointer;
      }
      .fullscreen-btn:hover {
        background: var(--gold);
        color: var(--night);
      }
      .hint {
        margin: 8px 0 14px;
        opacity: 0.85;
        min-height: 1.4em;
      }
      #map {
        display: grid;
        grid-template-columns: repeat(21, var(--t));
        width: max-content;
        max-width: 100%;
        margin: 0 auto;
        border: 4px solid var(--stone);
        border-radius: 6px;
        box-shadow: 0 10px 30px #0008;
      }
      .tile {
        width: var(--t);
        height: var(--t);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--t) * 0.68);
        line-height: 1;
      }
      .floor {
        background: var(--floor);
      }
      .floor.alt {
        background: var(--floor-alt);
      }
      .wall {
        background: linear-gradient(var(--stone), var(--stone-dark));
        box-shadow: inset 0 0 0 1px #0004;
      }
      .torch,
      .shelf {
        background: var(--stone-dark);
      }
      .door {
        background: #7a4b2a;
        box-shadow: inset 0 0 0 2px #3c2412;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .open {
        background: var(--floor);
      }
      .goal {
        background: var(--gold);
        box-shadow: inset 0 0 8px #fff8;
      }
      @keyframes pulse {
        50% {
          filter: brightness(1.35);
        }
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(4, 56px);
        gap: 8px;
        justify-content: center;
        margin-top: 16px;
      }
      .pad button {
        height: 48px;
        border: 0;
        border-radius: 10px;
        background: var(--stone);
        color: var(--ink);
        font-size: 1.2rem;
        cursor: pointer;
      }
      .pad button:active {
        background: var(--gold);
        color: var(--night);
      }
      @media (min-width: 900px) {
        .pad {
          display: none;
        }
      }
      .ad-rail {
        display: flex;
        justify-content: center;
        margin-top: 110px;
      }
      .ad-card {
        display: grid;
        width: 320px;
        min-height: 292px;
        align-content: start;
        justify-items: center;
        gap: 10px;
        padding: 14px 0;
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #ffffff0d;
      }
      .ad-label {
        color: #ffffff90;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .ad-card .adsbygoogle {
        display: inline-block;
        width: 300px;
        height: 250px;
      }
      .bottom-ad {
        display: grid;
        justify-items: center;
        gap: 8px;
        width: min(970px, calc(100% - 32px));
        min-height: 120px;
        margin: 24px auto 0;
        padding: 14px;
        border: 1px solid #ffffff24;
        border-radius: 16px;
        background: #ffffff0d;
      }
      .bottom-ad .adsbygoogle {
        display: block;
        width: 100%;
        min-height: 90px;
      }
      @media (max-width: 1050px) {
        .game-layout {
          display: block;
          max-width: 832px;
        }
        .ad-rail {
          margin-top: 0;
        }
      }
      @media (max-height: 600px) {
        .in-game-ad {
          display: none !important;
        }
      }
      .game-area:fullscreen,
      .game-area:-webkit-full-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        overflow: auto;
        padding: 16px;
        background: radial-gradient(circle at 50% 0, #2e2a52, var(--night) 70%);
      }
      .game-area:fullscreen .game,
      .game-area:-webkit-full-screen .game {
        max-width: 800px;
      }
      .game-area:fullscreen + .ad-rail,
      .game-area:-webkit-full-screen + .ad-rail {
        display: none !important;
      }
      @media (max-width: 480px) {
        body {
          padding: 8px;
        }
        .bottom-ad {
          width: calc(100% - 16px);
          margin-top: 16px;
          padding: 10px;
        }
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #0009;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal[hidden] {
        display: none;
      }
      .card {
        position: relative;
        background: #f5eedc;
        color: #2b2540;
        width: 100%;
        max-width: 480px;
        border-radius: 12px;
        padding: 22px;
        text-align: left;
        border-top: 8px solid var(--gold);
        box-shadow: 0 20px 50px #000a;
      }
      .topic {
        margin: 0;
        font-weight: 700;
        color: var(--ruby);
        padding-right: 44px;
      }
      .count {
        margin: 2px 0 10px;
        font-size: 0.9rem;
        opacity: 0.7;
        min-height: 1.2em;
      }
      #say {
        position: absolute;
        top: 16px;
        right: 16px;
        border: 0;
        background: #2b254015;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
        cursor: pointer;
      }
      h2 {
        margin: 0 0 16px;
        font-family: Georgia, serif;
        font-size: 1.4rem;
        line-height: 1.4;
      }
      h2 .blank {
        display: inline-block;
        min-width: 3.5em;
        border-bottom: 3px solid var(--gold);
        text-align: center;
        color: var(--moss);
      }
      #options {
        display: grid;
        gap: 8px;
      }
      #options button {
        padding: 12px 14px;
        font-size: 1.05rem;
        text-align: left;
        border: 2px solid #2b254033;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        cursor: pointer;
      }
      #options button:hover:not(:disabled) {
        border-color: var(--gold);
      }
      #options button.right {
        background: #d6efdc;
        border-color: var(--moss);
      }
      #options button.wrong {
        background: #f6d4d8;
        border-color: var(--ruby);
      }
      .feedback {
        min-height: 1.4em;
        margin: 12px 0 0;
        font-weight: 600;
      }
      .next {
        margin-top: 10px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: var(--night);
        color: var(--ink);
        font-size: 1rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .door {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-layout">
      <div class="game-area" id="gameArea">
        <main class="game">
          <header>
            <h1>Grammar Castle</h1>
            <div class="hud">
              <span id="hearts" aria-label="Hearts"></span
              ><span id="keys" aria-label="Doors opened"></span
              ><button
                class="fullscreen-btn"
                id="fullscreenBtn"
                aria-label="Enter fullscreen"
                title="Enter fullscreen"
              >
                ⛶
              </button>
            </div>
          </header>
          <p class="hint" id="hint">
            Walk with the arrow keys or WASD. Bump into a guard to answer
            questions.
          </p>
          <div id="map" role="img" aria-label="Castle map" tabindex="-1"></div>
          <div class="pad" aria-label="Controls">
            <button data-d="up" aria-label="Up">▲</button
            ><button data-d="left" aria-label="Left">◀</button>
            <button data-d="down" aria-label="Down">▼</button
            ><button data-d="right" aria-label="Right">▶</button>
          </div>
        </main>

        <div
          id="modal"
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="question"
          hidden
        >
          <div class="card">
            <p class="topic" id="topic"></p>
            <p class="count" id="count"></p>
            <button id="say" aria-label="Read aloud">🔊</button>
            <h2 id="question"></h2>
            <div id="options"></div>
            <p id="feedback" class="feedback" aria-live="polite"></p>
            <button id="next" class="next" hidden></button>
          </div>
        </div>
      </div>
      <aside class="ad-rail in-game-ad" aria-label="Advertisement">
        <div class="ad-card">
          <span class="ad-label">Advertisement</span>
          <ins
            class="adsbygoogle"
            style="display: inline-block; width: 300px; height: 250px"
            data-ad-client="ca-pub-2456627863532019"
            data-ad-slot="9319754067"
          ></ins>
        </div>
      </aside>
    </div>
    <section class="bottom-ad" aria-label="Advertisement">
      <span class="ad-label">Advertisement</span>
      <ins
        class="adsbygoogle"
        style="display: block; min-height: 90px"
        data-ad-client="ca-pub-2456627863532019"
        data-ad-slot="2586206204"
        data-ad-format="auto"
        data-full-width-responsive="true"
      ></ins>
    </section>
    <script>
      document.querySelectorAll(".adsbygoogle").forEach((adUnit) => {
        if (!adUnit.dataset.adsbygoogleStatus) {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (error) {
            console.warn(
              "Castle Adventure ad could not be initialized.",

            );
          }
        }
      });

    <script>
      // ---- EDIT QUESTIONS HERE: [sentence with ___, [options], index of right answer, explanation] ----
      // Each guard has 5 questions and asks 3 random ones, so replays feel different.
      const DOORS = {
        1: {
          topic: "Present Simple",
          qs: [
            [
              "She ___ to school every day.",
              ["go", "goes", "going"],
              1,
              "He/she/it takes -s or -es: she goes.",
            ],
            [
              "They ___ football on Sundays.",
              ["plays", "play", "playing"],
              1,
              "With I/you/we/they, use the base verb: they play.",
            ],
            [
              "He ___ not like coffee.",
              ["do", "is", "does"],
              2,
              "Negative with he/she/it: does + not + base verb.",
            ],
            [
              "I ___ breakfast at 7 o'clock.",
              ["has", "have", "having"],
              1,
              "With I, use have (not has).",
            ],
            [
              "___ your brother live here?",
              ["Do", "Does", "Is"],
              1,
              "Questions with he/she/it start with Does.",
            ],
          ],
        },
        2: {
          topic: "Past Simple",
          qs: [
            [
              "Yesterday I ___ a movie.",
              ["watch", "watched", "watching"],
              1,
              "Regular past verbs end in -ed.",
            ],
            [
              "We ___ to Paris last year.",
              ["goed", "go", "went"],
              2,
              "Go is irregular: go → went.",
            ],
            [
              "___ you see the dragon?",
              ["Did", "Do", "Does"],
              0,
              "Past questions use did + subject + base verb.",
            ],
            [
              "She didn't ___ the answer.",
              ["knew", "know", "known"],
              1,
              "After didn't, use the base verb: know.",
            ],
            [
              "They ___ happy when the knight arrived.",
              ["was", "were", "are"],
              1,
              "Past of be with they/we/you: were.",
            ],
          ],
        },
        3: {
          topic: "Articles & Prepositions",
          qs: [
            [
              "I have ___ apple.",
              ["a", "an", "the"],
              1,
              "Use an before a vowel sound.",
            ],
            [
              "The meeting is ___ Monday.",
              ["in", "at", "on"],
              2,
              "Use on with days of the week.",
            ],
            [
              "The queen was born ___ 1998.",
              ["on", "in", "at"],
              1,
              "Use in with years, months and seasons.",
            ],
            [
              "We arrive ___ 6 p.m.",
              ["at", "on", "in"],
              0,
              "Use at with clock times.",
            ],
            [
              "She is ___ best singer in the castle.",
              ["a", "the", "an"],
              1,
              "Use the with superlatives like best.",
            ],
          ],
        },
        4: {
          topic: "Comparatives & Superlatives",
          qs: [
            [
              "This castle is ___ than mine.",
              ["big", "bigger", "biggest"],
              1,
              "Compare two things: adjective + -er + than.",
            ],
            [
              "He is the ___ knight in the kingdom.",
              ["braver", "most brave", "bravest"],
              2,
              "The + adjective + -est for the top of a group.",
            ],
            [
              "This book is ___ interesting than that one.",
              ["more", "most", "much"],
              0,
              "Long adjectives use more + adjective + than.",
            ],
            [
              "Dragons are ___ than horses.",
              ["dangerouser", "more dangerous", "most dangerous"],
              1,
              "Long adjectives: more dangerous (not dangerouser).",
            ],
            [
              "Today is ___ day of my life.",
              ["good", "better", "the best"],
              2,
              "Use the best for the top of everything.",
            ],
          ],
        },
      };

      const MAP = [
        "#####################",
        "#T..#T..#T..#T..#T..#",
        "#...#...#...#...#...#",
        "#P..1...2...3...4..K#", // numbers = guards, K = throne room
        "#...#...#...#...#...#",
        "#..B#..B#..B#..B#..B#",
        "#####################",
      ];
      const START = { x: 1, y: 3 };
      const $ = (id) => document.getElementById(id);
      const grid = MAP.map((r) => r.split(""));
      const shuffle = (a) => {
        a = [...a];
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const hasSpeech = "speechSynthesis" in window;
      let pos,
        hearts,
        opened,
        quiz,
        mistakes,
        t0,
        over,
        speakText = "";

      function newGame() {
        pos = { ...START };
        hearts = 3;
        opened = new Set();
        quiz = null;
        mistakes = 0;
        over = false;
        t0 = Date.now();
        draw();
      }

      function draw() {
        const m = $("map");
        m.innerHTML = "";
        grid.forEach((row, y) =>
          row.forEach((c, x) => {
            const d = document.createElement("div");
            let cls = "floor" + ((x + y) % 2 ? " alt" : ""),
              txt = "";
            if (c === "#") cls = "wall";
            else if (c === "T") {
              cls = "torch";
              txt = "🕯️";
            } else if (c === "B") {
              cls = "shelf";
              txt = "📚";
            } else if (DOORS[c]) {
              if (opened.has(c)) cls = "open";
              else {
                cls = "door";
                txt = "🛡️";
              }
            } else if (c === "K") {
              cls = "goal";
              txt = "👑";
            }
            if (pos.x === x && pos.y === y) txt = "🧙";
            d.className = "tile " + cls;
            d.textContent = txt;
            m.appendChild(d);
          }),
        );
        $("hearts").textContent = "❤️".repeat(hearts) + "🖤".repeat(3 - hearts);
        $("keys").textContent =
          "🗝️ " + opened.size + "/" + Object.keys(DOORS).length;
      }

      function move(dx, dy) {
        if (quiz || over) return;
        const nx = pos.x + dx,
          ny = pos.y + dy,
          c = grid[ny] && grid[ny][nx];
        if (!c || c === "#" || c === "T" || c === "B") return;
        if (DOORS[c] && !opened.has(c)) {
          startQuiz(c);
          return;
        }
        pos = { x: nx, y: ny };
        draw();
        if (c === "K") win();
      }

      // ---- Modal helpers ----
      function setQuestion(text, fill) {
        const h = $("question"),
          p = text.split("___");
        h.textContent = p[0];
        const b = document.createElement("span");
        b.className = "blank";
        b.textContent = fill || "";
        h.append(b, p[1] || "");
        speakText = fill
          ? p[0] + fill + (p[1] || "")
          : text.replace("___", "blank");
      }
      function info(topic, text, label, fn) {
        $("topic").textContent = topic;
        $("count").textContent = "";
        $("question").textContent = text;
        speakText = text;
        $("options").innerHTML = "";
        $("feedback").textContent = "";
        const nb = $("next");
        nb.hidden = false;
        nb.textContent = label;
        nb.onclick = fn;
        $("modal").hidden = false;
        nb.focus();
      }
      function hint(t) {
        $("hint").textContent = t;
      }
      function closeModal() {
        $("modal").hidden = true;
        $("map").focus({ preventScroll: true });
      }

      function updateFullscreenButton() {
        const active =
          document.fullscreenElement === $("gameArea") ||
          document.webkitFullscreenElement === $("gameArea");
        const button = $("fullscreenBtn");
        button.textContent = active ? "⤢" : "⛶";
        button.setAttribute(
          "aria-label",
          active ? "Exit fullscreen" : "Enter fullscreen",
        );
        button.title = active ? "Exit fullscreen" : "Enter fullscreen";
      }

      async function toggleFullscreen() {
        const area = $("gameArea");
        try {
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen)
              document.webkitExitFullscreen();
          } else if (area.requestFullscreen) {
            await area.requestFullscreen();
          } else if (area.webkitRequestFullscreen) {
            area.webkitRequestFullscreen();
          } else {
            hint("Fullscreen is not available here.");
          }
        } catch {
          hint("Could not switch fullscreen mode.");
        }
        updateFullscreenButton();
      }

      // ---- Quiz ----
      function startQuiz(id) {
        quiz = { id, qs: shuffle(DOORS[id].qs).slice(0, 3), i: 0 };
        hearts = 3;
        draw();
        $("topic").textContent = "Guard " + id + ": " + DOORS[id].topic;
        $("modal").hidden = false;
        showQ();
      }

      function showQ() {
        const q = quiz.qs[quiz.i];
        $("count").textContent =
          "Question " +
          (quiz.i + 1) +
          " of " +
          quiz.qs.length +
          "   " +
          "❤️".repeat(hearts) +
          "🖤".repeat(3 - hearts);
        setQuestion(q[0]);
        $("feedback").textContent = "";
        $("next").hidden = true;
        const box = $("options");
        box.innerHTML = "";
        shuffle(q[1].map((t, i) => [t, i])).forEach(([t, i], n) => {
          const b = document.createElement("button");
          b.textContent = n + 1 + ".  " + t;
          b.onclick = () => answer(b, i, t);
          box.appendChild(b);
        });
        box.firstChild.focus();
      }

      function answer(btn, i, text) {
        const q = quiz.qs[quiz.i],
          ok = i === q[2],
          nb = $("next");
        [...$("options").children].forEach((b) => (b.disabled = true));
        btn.classList.add(ok ? "right" : "wrong");
        $("feedback").textContent = (ok ? "Correct! " : "Not quite. ") + q[3];
        nb.hidden = false;
        if (ok) {
          setQuestion(q[0], text);
          const last = quiz.i === quiz.qs.length - 1;
          nb.textContent = last ? "Open the door 🚪" : "Next question";
          nb.onclick = () => {
            if (last) {
              opened.add(quiz.id);
              quiz = null;
              closeModal();
              draw();
              hint("The door creaks open. Keep going!");
            } else {
              quiz.i++;
              showQ();
            }
          };
        } else {
          hearts--;
          mistakes++;
          draw();
          if (hearts <= 0) {
            nb.textContent = "Back to the start";
            nb.onclick = () => {
              quiz = null;
              closeModal();
              pos = { ...START };
              hearts = 3;
              draw();
              hint("The guard sent you back. Study and try again!");
            };
          } else {
            nb.textContent = "Try again";
            nb.onclick = showQ;
          }
        }
        nb.focus();
      }

      function leaveQuiz() {
        quiz = null;
        hearts = 3;
        closeModal();
        draw();
        hint("You walked away. Come back when you're ready.");
      }

      function win() {
        over = true;
        const s = Math.round((Date.now() - t0) / 1000),
          time = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        const stars = mistakes === 0 ? "⭐⭐⭐" : mistakes <= 3 ? "⭐⭐" : "⭐";
        info(
          "You made it! " + stars,
          "👑 You reached the throne room! Time: " +
            time +
            ". Mistakes: " +
            mistakes +
            ".",
          "Play again",
          () => {
            closeModal();
            newGame();
            hint("A new adventure begins!");
          },
        );
      }

      // ---- Input ----
      const DIRS = {
        ArrowUp: [0, -1],
        w: [0, -1],
        ArrowDown: [0, 1],
        s: [0, 1],
        ArrowLeft: [-1, 0],
        a: [-1, 0],
        ArrowRight: [1, 0],
        d: [1, 0],
      };
      addEventListener("keydown", (e) => {
        if (!$("modal").hidden) {
          if (e.key === "Escape" && quiz) leaveQuiz();
          const n = parseInt(e.key, 10),
            b = quiz && $("options").children[n - 1];
          if (b && !b.disabled) b.click();
          return;
        }
        const k = DIRS[e.key] || DIRS[e.key.toLowerCase()];
        if (k) {
          e.preventDefault();
          move(...k);
        }
      });
      document
        .querySelectorAll(".pad button")
        .forEach(
          (b) =>
            (b.onclick = () =>
              move(
                ...{ up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[
                  b.dataset.d
                ],
              )),
        );
      $("fullscreenBtn").onclick = toggleFullscreen;
      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener(
        "webkitfullscreenchange",
        updateFullscreenButton,
      );
      if (hasSpeech)
        $("say").onclick = () => {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(speakText);
          u.lang = "en-US";
          u.rate = 0.9;
          speechSynthesis.speak(u);
        };
      else $("say").hidden = true;

      newGame();
      info(
        "Welcome, traveler",
        "Four guards protect the castle. Answer their grammar questions to open each door and reach the throne room 👑.",
        "Enter the castle",
        closeModal,
      );
    </script>
  </body>
</html>
